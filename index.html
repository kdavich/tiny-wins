<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Routine">
    <title>My Routine</title>

    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%234A90E2%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 font-size=%2270%22>🎉</text></svg>">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%234A90E2%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 font-size=%2270%22>🎉</text></svg>">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

    <style>
        :root {
            --primary: #4A90E2;
            --success: #2ECC71;
            --bg: #F0F4F8;
            --card-bg: #FFFFFF;
            
            /* Theme Colors */
            --morning-bg: #F0F4F8;
            --morning-text: #333;
            
            --afternoon-bg: #FDEBD0; /* Soft Orange */
            --afternoon-text: #5D4037;
            
            --evening-bg: #2C3E50;
            --evening-text: #ECF0F1;
            
            --danger: #ff4757;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--morning-bg);
            color: var(--morning-text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            box-sizing: border-box;
            overflow: hidden;
            transition: background-color 0.5s, color 0.5s;
        }

        /* THEMES */
        body.mode-afternoon {
            background-color: var(--afternoon-bg);
            color: var(--afternoon-text);
        }
        body.mode-afternoon h1 { color: var(--afternoon-text); }
        
        body.mode-evening {
            background-color: var(--evening-bg);
            color: var(--evening-text);
        }
        body.mode-evening h1 { color: var(--evening-text); }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            padding-top: max(15px, env(safe-area-inset-top));
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 100;
        }

        .mode-switch {
            background: rgba(255,255,255,0.5);
            border-radius: 30px;
            padding: 4px;
            display: flex;
            border: 1px solid rgba(0,0,0,0.1);
            gap: 5px;
        }

        .mode-btn {
            font-size: 1.4rem;
            padding: 2px 10px;
            cursor: pointer;
            border-radius: 25px;
            background: transparent;
            border: none;
            opacity: 0.4;
            transition: all 0.3s;
        }

        .mode-btn.active {
            background: white;
            opacity: 1;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transform: scale(1.1);
        }

        /* CONTROLS */
        .top-controls { display: flex; gap: 10px; }

        .icon-btn {
            width: 44px; height: 44px;
            border-radius: 50%; border: none;
            font-size: 1.5rem;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }
        .icon-btn:active { transform: scale(0.9); }
        .reset-btn { color: var(--danger); }

        h1 {
            text-align: center; margin: 10px 0; font-size: 1.5rem; flex-shrink: 0;
            text-shadow: 0 1px 1px rgba(255,255,255,0.2);
        }

        /* GRID */
        #routine-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 100px;
            -webkit-overflow-scrolling: touch;
        }

        .task-card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            aspect-ratio: 1;
            cursor: pointer;
            transition: transform 0.2s;
            border: 4px solid transparent;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            color: #333;
            position: relative;
        }

        .task-card:active { transform: scale(0.95); }
        .task-emoji { font-size: 4rem; margin-bottom: 10px; }
        .task-label { font-size: 1.2rem; font-weight: bold; color: #555; text-align: center; }

        .task-card.done {
            background-color: #E8F8F5; border-color: var(--success); opacity: 0.6;
        }
        .task-card.done .task-emoji::after {
            content: '✅'; position: absolute; font-size: 3rem;
            transform: translate(-50%, -50%); left: 50%; top: 50%;
        }
        .task-card.done .task-emoji { opacity: 0.3; }

        /* SETTINGS */
        #settings-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 200; padding: 20px; box-sizing: border-box;
            flex-direction: column; color: #333;
            padding-top: max(20px, env(safe-area-inset-top));
        }

        .settings-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; border-bottom: 1px solid #ccc; padding-bottom: 10px; flex-shrink: 0;
        }

        #settings-content { flex-grow: 1; overflow-y: auto; padding-bottom: 50px; }

        .task-editor-row {
            display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; gap: 8px;
            background: white;
        }
        
        /* Drag Handle */
        .drag-handle {
            font-size: 1.5rem; color: #ccc; cursor: grab; padding: 0 5px;
        }

        .task-editor-row input[type="checkbox"] { transform: scale(1.3); margin: 0 5px; }
        .edit-emoji { width: 35px; font-size: 1.4rem; text-align: center; border: 1px solid #ddd; border-radius: 5px; padding: 5px; }
        .edit-label { flex-grow: 1; font-size: 1rem; padding: 8px; border: 1px solid #ddd; border-radius: 5px; }
        .delete-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #ccc; padding: 0 5px; }
        .delete-btn:hover { color: var(--danger); }

        .add-btn {
            width: 100%; padding: 15px; background: var(--primary); color: white;
            border: none; border-radius: 10px; font-size: 1.1rem; margin-top: 20px; cursor: pointer;
        }
        
        button.control-btn { background: #eee; border: none; padding: 8px 15px; border-radius: 10px; font-size: 1rem; color: #555; }

        /* CELEBRATION */
        #celebration {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 300; align-items: center; justify-content: center;
            flex-direction: column; color: white; text-align: center;
        }
        #celebration h1 { color: white; font-size: 3rem; margin: 20px 0; }
        .big-star { font-size: 8rem; animation: spin 3s infinite linear; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        #confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 301; }
    </style>
</head>
<body>

    <header>
        <div class="mode-switch">
            <button class="mode-btn active" id="btn-morning" onclick="setMode('morning')">☀️</button>
            <button class="mode-btn" id="btn-afternoon" onclick="setMode('afternoon')">⛅</button>
            <button class="mode-btn" id="btn-evening" onclick="setMode('evening')">🌙</button>
        </div>
        <div class="top-controls">
            <button class="icon-btn" onclick="openSettings()" aria-label="Settings">⚙️</button>
            <button class="icon-btn reset-btn" onclick="resetRoutine()" aria-label="Reset">🔄</button>
        </div>
    </header>

    <h1 id="page-title">Good Morning!</h1>

    <div id="routine-grid"></div>

    <div id="settings-modal">
        <div class="settings-header">
            <h2 id="settings-title">Edit Routine</h2>
            <button class="control-btn" onclick="closeSettings()">Done</button>
        </div>
        <div style="margin-bottom:10px; color:#666; font-size:0.9rem;">
            Drag <strong>☰</strong> to reorder. Check to show.
        </div>
        <div id="settings-content">
            <div id="settings-list"></div>
            <button class="add-btn" onclick="addNewTask()">+ Add New Task</button>
        </div>
    </div>

    <div id="celebration" onclick="closeCelebration()">
        <div class="big-star">⭐</div>
        <h1>YOU DID IT!</h1>
        <p>(Tap to close)</p>
    </div>
    <canvas id="confetti-canvas"></canvas>

<script>
    // --- DATA ---
    const defaults = [
        { id: 'potty', label: 'Potty', emoji: '🚽' },
        { id: 'hands', label: 'Wash Hands', emoji: '🧼' },
        { id: 'breakfast', label: 'Eat Breakfast', emoji: '🥞' },
        { id: 'lunch', label: 'Eat Lunch', emoji: '🥪' },
        { id: 'dinner', label: 'Eat Dinner', emoji: '🍽️' },
        { id: 'bath', label: 'Bath Time', emoji: '🛁' },
        { id: 'pjs', label: 'Pajamas', emoji: '👕' },
        { id: 'dressed', label: 'Get Dressed', emoji: '👕' },
        { id: 'teeth', label: 'Brush Teeth', emoji: '🪥' },
        { id: 'book', label: 'Read Book', emoji: '📚' },
        { id: 'toys', label: 'Clean Toys', emoji: '🧸' },
        { id: 'bed', label: 'Bedtime', emoji: '🛏️' },
        { id: 'shoes', label: 'Put on Shoes', emoji: '👟' },
        { id: 'coat', label: 'Wear Coat', emoji: '🧥' },
        { id: 'car', label: 'Get in Car', emoji: '🚗' },
        { id: 'water', label: 'Drink Water', emoji: '💧' },
        { id: 'nap', label: 'Nap Time', emoji: '😴' },
        { id: 'pack', label: 'Pack Bag', emoji: '🎒' },
        { id: 'park', label: 'Go to Park', emoji: '🛝' }
    ];

    let allTasks = JSON.parse(localStorage.getItem('myRoutineAllTasks')) || defaults;
    
    let taskLists = JSON.parse(localStorage.getItem('myRoutineLists')) || {
        morning: ['potty', 'breakfast', 'dressed', 'teeth', 'shoes'],
        afternoon: ['lunch', 'nap', 'potty', 'park'],
        evening: ['dinner', 'bath', 'pjs', 'teeth', 'book', 'bed']
    };
    
    let completedState = JSON.parse(localStorage.getItem('myRoutineState')) || { 
        morning: [], afternoon: [], evening: [] 
    };
    
    let currentMode = 'morning';

    // UI Elements
    const grid = document.getElementById('routine-grid');
    const settingsList = document.getElementById('settings-list');
    const celebrationModal = document.getElementById('celebration');
    const pageTitle = document.getElementById('page-title');

    function init() { 
        setMode('morning'); 
        
        // Initialize SortableJS for Drag and Drop
        new Sortable(settingsList, {
            handle: '.drag-handle', // Drag handle selector within list items
            animation: 150,
            onEnd: function (evt) {
                updateOrderFromDOM();
            }
        });
    }

    function saveAll() {
        localStorage.setItem('myRoutineAllTasks', JSON.stringify(allTasks));
        localStorage.setItem('myRoutineLists', JSON.stringify(taskLists));
        localStorage.setItem('myRoutineState', JSON.stringify(completedState));
    }

    function setMode(mode) {
        currentMode = mode;
        
        // Reset Buttons
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + mode).classList.add('active');
        
        // Theme Classes
        document.body.className = 'mode-' + mode;
        
        // Titles
        if(mode === 'morning') pageTitle.innerText = "Good Morning!";
        else if(mode === 'afternoon') pageTitle.innerText = "Afternoon!";
        else pageTitle.innerText = "Good Night!";
        
        renderGrid();
    }

    function renderGrid() {
        grid.innerHTML = '';
        const activeIDs = taskLists[currentMode];
        const doneIDs = completedState[currentMode];
        
        // Render in the order they appear in taskLists
        const validIDs = activeIDs.filter(id => allTasks.find(t => t.id === id));
        
        if (validIDs.length === 0) {
            grid.innerHTML = '<p style="text-align:center; width:100%; opacity:0.6; margin-top:20px;">No tasks set. Tap ⚙️ to add some!</p>';
            return;
        }

        validIDs.forEach(id => {
            const task = allTasks.find(t => t.id === id);
            const card = document.createElement('div');
            card.className = `task-card ${doneIDs.includes(id) ? 'done' : ''}`;
            card.onclick = () => toggleTask(id);
            card.innerHTML = `<div class="task-emoji">${task.emoji}</div><div class="task-label">${task.label}</div>`;
            grid.appendChild(card);
        });
    }

    function toggleTask(id) {
        let doneTasks = completedState[currentMode];
        if (doneTasks.includes(id)) { doneTasks = doneTasks.filter(t => t !== id); }
        else {
            doneTasks.push(id);
            if (isAllDone(doneTasks)) setTimeout(triggerCelebration, 500);
        }
        completedState[currentMode] = doneTasks;
        saveAll();
        renderGrid();
    }

    function isAllDone(doneList) {
        const required = taskLists[currentMode].filter(id => allTasks.find(t => t.id === id));
        return required.length > 0 && required.every(id => doneList.includes(id));
    }

    function resetRoutine() {
        if(confirm("Start " + currentMode + " over?")) {
            completedState[currentMode] = [];
            saveAll();
            renderGrid();
        }
    }

    function triggerCelebration() { celebrationModal.style.display = 'flex'; startConfetti(); }
    function closeCelebration() { celebrationModal.style.display = 'none'; stopConfetti(); }

    function openSettings() {
        document.getElementById('settings-modal').style.display = 'flex';
        document.getElementById('settings-title').innerText = "Edit " + currentMode.charAt(0).toUpperCase() + currentMode.slice(1);
        renderSettingsList();
    }

    function closeSettings() {
        document.getElementById('settings-modal').style.display = 'none';
        renderGrid();
    }

    function renderSettingsList() {
        settingsList.innerHTML = '';
        const currentList = taskLists[currentMode];
        
        // 1. First render items currently in the list (in order)
        currentList.forEach(id => {
            const task = allTasks.find(t => t.id === id);
            if(task) createSettingRow(task, true);
        });

        // 2. Then render items NOT in the list
        allTasks.forEach(task => {
            if(!currentList.includes(task.id)) {
                createSettingRow(task, false);
            }
        });
    }

    function createSettingRow(task, isChecked) {
        const row = document.createElement('div');
        row.className = 'task-editor-row';
        row.dataset.id = task.id; // Store ID for drag/drop
        
        row.innerHTML = `
            <div class="drag-handle">☰</div>
            <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleSettingSelection('${task.id}')">
            <input type="text" class="edit-emoji" value="${task.emoji}" onchange="updateTaskProp('${task.id}', 'emoji', this.value)">
            <input type="text" class="edit-label" value="${task.label}" onchange="updateTaskProp('${task.id}', 'label', this.value)">
            <button class="delete-btn" onclick="deleteTask('${task.id}')">🗑️</button>
        `;
        settingsList.appendChild(row);
    }

    // Called whenever drag ends or checkbox clicks
    function updateOrderFromDOM() {
        const rows = document.querySelectorAll('.task-editor-row');
        let newOrder = [];
        
        rows.forEach(row => {
            const id = row.dataset.id;
            const checkbox = row.querySelector('input[type="checkbox"]');
            if (checkbox.checked) {
                newOrder.push(id);
            }
        });
        
        taskLists[currentMode] = newOrder;
        saveAll();
        // Don't re-render Settings here, or it jumps. Only render Grid on close.
    }

    function toggleSettingSelection(id) {
        // Just run the order update, it handles checks/unchecks based on DOM
        updateOrderFromDOM();
    }

    function updateTaskProp(id, prop, value) {
        const task = allTasks.find(t => t.id === id);
        if (task) { task[prop] = value; saveAll(); }
    }

    function addNewTask() {
        const newId = 'task_' + Date.now();
        const newTask = { id: newId, label: 'New Task', emoji: '⭐' };
        allTasks.push(newTask);
        taskLists[currentMode].push(newId);
        saveAll();
        renderSettingsList();
    }

    function deleteTask(id) {
        if(confirm("Delete this task permanently?")) {
            allTasks = allTasks.filter(t => t.id !== id);
            taskLists.morning = taskLists.morning.filter(t => t !== id);
            taskLists.afternoon = taskLists.afternoon.filter(t => t !== id);
            taskLists.evening = taskLists.evening.filter(t => t !== id);
            saveAll();
            renderSettingsList();
        }
    }

    // --- CONFETTI ---
    let confettiActive = false;
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    function startConfetti() { confettiActive = true; particles = []; animateConfetti(); }
    function stopConfetti() { confettiActive = false; ctx.clearRect(0, 0, canvas.width, canvas.height); }
    function createParticle() {
        const colors = ['#f44336', '#e91e63', '#9c27b0', '#673ab7', '#2196f3', '#03a9f4', '#00bcd4', '#009688', '#4caf50', '#8bc34a', '#cddc39', '#ffeb3b', '#ffc107', '#ff9800', '#ff5722'];
        return {
            x: Math.random() * canvas.width, y: -20,
            color: colors[Math.floor(Math.random() * colors.length)],
            size: Math.random() * 10 + 5,
            speedY: Math.random() * 3 + 2, speedX: Math.random() * 4 - 2,
            rotation: Math.random() * 360, rotationSpeed: Math.random() * 10 - 5
        };
    }
    function animateConfetti() {
        if (!confettiActive && particles.length === 0) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (confettiActive && particles.length < 150) particles.push(createParticle());
        particles.forEach((p, index) => {
            p.y += p.speedY; p.x += p.speedX; p.rotation += p.rotationSpeed;
            ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rotation * Math.PI / 180);
            ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            ctx.restore();
            if (p.y > canvas.height) particles.splice(index, 1);
        });
        requestAnimationFrame(animateConfetti);
    }

    init();
</script>
</body>
</html>
